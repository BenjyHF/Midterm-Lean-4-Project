name: Lean 4 verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout submitted source and dependency lock
        uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Confirm pinned dependency manifest
        run: test -f lake-manifest.json
      - name: Retrieve precompiled mathlib cache
        run: lake exe cache get
      - name: Compile main Lean project
        run: lake build
      - name: Check the submitted Lean source directly
        run: lake env lean RidgeOptimality.lean
      - name: Reject unfinished proof placeholders
        run: |
          if grep -nE '\b(sorry|admit)\b' RidgeOptimality.lean; then
            echo "An unfinished proof placeholder was found"
            exit 1
          fi
