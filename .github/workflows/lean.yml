name: Lean 4 verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Generate dependency manifest
        run: lake update
      - name: Retrieve precompiled mathlib cache
        run: lake exe cache get
      - name: Compile the main Lean project
        run: lake build
      - name: Check the additional Lean proof
        run: lake env lean ridge.lean
      - name: Reject unfinished proofs
        run: |
          if grep -nE '\b(sorry|admit)\b' RidgeOptimality.lean ridge.lean; then
            echo "An unfinished proof placeholder was found"
            exit 1
          fi
